[package]
name = "dblab"
version = "0.1.0"
edition = "2024"

[dependencies]
memmap2 = "0.9.11"
rusqlite = { version = "0.40.2", features = ["backup"] }
sqlparser = "0.63.0"
turso = "0.8.3"
tokio = { version = "1", features = ["rt", "macros"] }

[features]
bundled = ["rusqlite/bundled"]

[profile.release]
debug = 1
