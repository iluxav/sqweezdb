[package]
name = "sqweezdb"
version = "0.1.0"
edition = "2024"

[lib]
name = "sqweezdb"
crate-type = ["rlib", "cdylib"]

[dependencies]
memmap2 = "0.9.11"
rusqlite = { version = "0.40.2", features = ["backup", "hooks"] }
sqlparser = "0.63.0"
turso = "0.8.3"
tokio = { version = "1", features = ["rt", "macros"] }
object_store = { version = "0.13", features = ["aws"] }
futures-util = "0.3"
zstd = "0.13"
aes-gcm = "0.10"
sha2 = "0.10"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[features]
bundled = ["rusqlite/bundled"]

[profile.release]
debug = 1
