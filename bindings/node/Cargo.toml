[package]
name = "sqweezdb_node"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
sqweezdb = { path = "../.." }   # includes the web console (off until listen.http is set)
napi = { version = "2", default-features = false, features = ["napi8"] }
napi-derive = "2"

[build-dependencies]
napi-build = "2"

[profile.release]
strip = true
