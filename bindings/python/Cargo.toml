[package]
name = "sqweezdb-python"
version = "0.2.0"
edition = "2024"
license = "MIT"

[lib]
name = "sqweezdb_py"
crate-type = ["cdylib"]

[dependencies]
sqweezdb = { path = "../.." }   # includes the web console (off until listen.http is set)
pyo3 = { version = "0.28", features = ["extension-module"] }

[profile.release]
strip = true
