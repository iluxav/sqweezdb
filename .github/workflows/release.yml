# Push a tag that matches Cargo.toml's version (v0.1.0 for version = "0.1.0") to publish a release with prebuilt
# binaries and SHA256SUMS; install.sh downloads from it. Run it by hand (workflow_dispatch) to build the artifacts
# without publishing.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc builds linked against glibc 2.17 (2012): as fast as a native build, run on any mainstream distro
          - { target: x86_64-unknown-linux-gnu,   os: ubuntu-latest, zig: true, glibc: '2.17' }
          - { target: aarch64-unknown-linux-gnu,  os: ubuntu-latest, zig: true, glibc: '2.17' }
          # static musl builds for Alpine and other systems without glibc (mimalloc; still ~1.6x slower per statement, E45)
          - { target: x86_64-unknown-linux-musl,  os: ubuntu-latest, zig: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, zig: true }
          - { target: x86_64-apple-darwin,        os: macos-latest,  zig: false }
          - { target: aarch64-apple-darwin,       os: macos-latest,  zig: false }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }} && rustup default stable
      - name: Zig linker for static Linux builds
        if: matrix.zig
        run: pip install ziglang cargo-zigbuild
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build and package
        run: make dist TARGET=${{ matrix.target }} GLIBC=${{ matrix.glibc }} CARGO_BUILD="${{ matrix.zig && 'cargo zigbuild' || 'cargo build' }}"
      - name: Smoke test (native targets)
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-apple-darwin'
        run: target/${{ matrix.target }}/dist/sqweezdb version
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  publish:
    name: publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: The tag must match the crate version
        run: |
          want="v$(make -s version)"
          [ "$want" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version (${want})"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: Checksums
        run: cd dist && cat ./*.sha256 > SHA256SUMS && rm ./*.sha256 && cat SHA256SUMS && sha256sum -c SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp install.sh dist/
          gh release create "${GITHUB_REF_NAME}" dist/* --title "sqweezdb ${GITHUB_REF_NAME}" --generate-notes \
            --notes "Install: curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh | sh"
